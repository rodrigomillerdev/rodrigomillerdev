<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="16" viewBox="0 0 1000 16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00E676" stop-opacity="0"/><stop offset="1" stop-color="#00E676"/></linearGradient>
  </defs>
  <style>.s{animation:s 6s cubic-bezier(.45,0,.55,1) infinite}@keyframes s{from{transform:translateX(-160px)}to{transform:translateX(1000px)}}</style>
  <line x1="0" y1="8" x2="1000" y2="8" stroke="#8B949E" stroke-opacity=".3"/>
  <rect class="s" x="0" y="7" width="160" height="2" fill="url(#g)"/>
</svg>
