<svg xmlns="http://www.w3.org/2000/svg" width="640" height="72" viewBox="0 0 640 72" role="img" aria-label="Hello, I’m Rodrigo Miller.">
  <title>Hello, I’m Rodrigo Miller.</title>
  <defs>
    <clipPath id="type"><rect class="reveal" x="34" y="0" width="572" height="72"/></clipPath>
  </defs>
  <style>
    .txt{font:700 34px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .reveal{transform-box:fill-box;transform-origin:left center;animation:reveal 7s steps(26,end) infinite}
    .cur{animation:move 7s steps(26,end) infinite,blink .8s steps(1) infinite}
    @keyframes reveal{0%{transform:scaleX(0)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    @keyframes move{0%{transform:translateX(0)}45%,85%{transform:translateX(572px)}100%{transform:translateX(0)}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <g clip-path="url(#type)">
    <text x="34" y="48" class="txt" fill="#00C853" textLength="572" lengthAdjust="spacingAndGlyphs">Hello, I’m Rodrigo Miller.</text>
  </g>
  <rect class="cur" x="36" y="18" width="3" height="38" fill="#00E676"/>
</svg>
